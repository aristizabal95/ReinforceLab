version: 2
title: 'ReinforceLab: CartPole Competition'
docker_image: codalab/codalab-legacy:py37
image: logo.png
description: Train and evaluate reinforcement learning agents on the CartPole-v1 environment.
  Phase 1 evaluates pre-trained agents on average return over multiple episodes. Phase
  2 measures training efficiency by tracking convergence time to target performance.
terms: pages/terms.md
registration_auto_approve: false
pages:
- title: Overview
  file: pages/overview.md
- title: Evaluation
  file: pages/evaluation.md
leaderboards:
- index: 0
  title: Results
  key: Results
  submission_rule: Force_Last
  columns:
  - title: Score
    key: score
    index: 0
    sorting: desc
tasks:
- index: 0
  name: Eval Task
  description: Task for Eval
  input_data: input_data
  reference_data: reference_data
  ingestion_program: ingestion_program_1
  scoring_program: scoring_program
- index: 1
  name: Train Task
  description: Task for Train
  input_data: input_data
  reference_data: reference_data
  ingestion_program: ingestion_program_2
  scoring_program: scoring_program
phases:
- index: 0
  name: Eval
  description: 'Eval phase: evaluation on CartPole-v1'
  start: 12-12-2025
  max_submissions_per_day: 5
  max_submissions: 100
  execution_time_limit: 600
  tasks:
  - 0
  solutions: []
  end: 1-12-2026
- index: 1
  name: Train
  description: 'Train phase: convergence on CartPole-v1'
  start: 1-13-2026
  max_submissions_per_day: 5
  max_submissions: 100
  execution_time_limit: 600
  tasks:
  - 1
  solutions: []
  end: 1-31-2026
solutions:
- index: 0
  tasks:
  - 0
  - 1
  path: solution/
